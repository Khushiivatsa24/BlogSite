<table class="table table-hover">
        <tr>
            <td width="70px">
                <a class="user_popup text-decoration-none" href="{{ url_for('main.user', username=post.author.username) }}">
                    <img src="{{ post.author.avatar(70) }}" />
                </a>
            </td>
            <td>
                <a class="user_popup text-decoration-none" href="{{ url_for('main.user', username=post.author.username) }}">
                    {{ post.author.username }}
                </a>
                said {{ moment(post.timestamp).fromNow() }}:
                <br>
                {{ post.body }}
               {% if request.endpoint ==  'main.user' and post.author == current_user %}
           <div class="dropdown float-end">
          <button class="btn btn-sm btn-link text-dark p-0 text-decoration-none" data-bs-toggle="dropdown">
          ...
        </button>
     <ul class="dropdown-menu">
        <li>
    <a class="dropdown-item" href="{{ url_for('main.edit_post', post_id=post.id) }}">Edit</a>
</li>
        <li>
            <form action="{{ url_for('main.delete_post', post_id=post.id) }}" method="post">
                {{ form.hidden_tag() }}
                <button type="submit" class="dropdown-item text-danger">Delete</button>
            </form>
        </li>
    </ul>
</div>
{% endif %}
            </td>
          </tr>
    </table>
    {% if post.language and post.language != g.locale %}
    <br><br>
    <a href="#">{{_('Translate') }}</a>
    {% endif %}
